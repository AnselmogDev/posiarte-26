<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolução da Inteligência Artificial</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="bg-grid"></div>

<header>
  <h1>Evolução da Inteligência Artificial</h1>
  <p class="subtitle">De regras fixas a modelos generativos — e o que vem depois</p>
</header>

<main>
  <div class="track-wrap">
    <div class="track" id="track">
      <div class="track-fill" id="trackFill"></div>
    </div>
  </div>

  <section class="panel" id="panel">
    <div class="panel-era" id="panelEra">ERA 01</div>
    <h2 class="panel-title" id="panelTitle">Título</h2>
    <p class="panel-desc" id="panelDesc">Descrição</p>
    <ul class="facts" id="panelFacts"></ul>
    <div class="nav-hint">
      <span id="panelYears">1950–1980</span>
      <div class="nav-btns">
        <button id="prevBtn" aria-label="Era anterior">←</button>
        <button id="nextBtn" aria-label="Próxima era">→</button>
      </div>
    </div>
  </section>

  <button id="openQuizBtn" class="quiz-cta">Testar meus conhecimentos →</button>

  <section class="panel quiz-panel hidden" id="quizSection">
    <button id="backToTimelineBtn" class="quiz-back">← Voltar à linha do tempo</button>

    <div id="quizQuestionScreen">
      <div class="quiz-progress-track">
        <div class="quiz-progress-fill" id="quizProgressFill"></div>
      </div>
      <div class="panel-era" id="quizCounter">PERGUNTA 1 / 12</div>
      <h2 class="panel-title" id="quizQuestion">Pergunta</h2>
      <div class="quiz-options" id="quizOptions"></div>
    </div>

    <div id="quizScoreScreen" class="hidden">
      <div class="panel-era">RESULTADO</div>
      <h2 class="panel-title" id="quizScoreTitle">Você acertou X de Y</h2>
      <p class="panel-desc" id="quizScoreMsg"></p>
      <button id="restartQuizBtn" class="quiz-cta">Refazer quiz</button>
    </div>
  </section>
</main>

<footer>clique nos pontos da linha do tempo, ou use as setas</footer>

<script src="script.js"></script>
<script src="quiz.js"></script>
</body>
</html>
